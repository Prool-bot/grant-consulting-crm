name: CRM 1.4 — Apps Script тестове оновлення

# Лише ручний запуск після налаштування окремого тестового Apps Script.
# ЖОДНИХ автоматичних записів у production CRM 1.3.
on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: 'Виберіть STAGING_ONLY, щоб підтвердити оновлення тільки тестового Script-проєкту'
        type: choice
        required: true
        options:
          - DO_NOT_DEPLOY
          - STAGING_ONLY

permissions:
  contents: read

concurrency:
  group: crm-apps-script-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Перевірка та оновлення ТІЛЬКИ тестового Apps Script
    if: ${{ github.event.inputs.confirm_staging == 'STAGING_ONLY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crm-staging
    steps:
      - name: Отримати перевірений код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Налаштувати Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Повний контроль тестів та приватної збірки
        run: |
          npm test
          npm run build
          node scripts/verify-cloud-release.js
      - name: Підготувати закриті параметри, перевірити ізоляцію від production
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CRM_STAGING_SCRIPT_ID: ${{ secrets.CRM_STAGING_SCRIPT_ID }}
          CRM_PRODUCTION_SCRIPT_ID: ${{ secrets.CRM_PRODUCTION_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path');
          const credentials=process.env.CLASPRC_JSON||'';
          const staging=(process.env.CRM_STAGING_SCRIPT_ID||'').trim();
          const production=(process.env.CRM_PRODUCTION_SCRIPT_ID||'').trim();
          if(!credentials||!staging||!production)throw Error('Не встановлено захищені секрети для staging.');
          if(staging===production)throw Error('ЗАБОРОНЕНО: тестовий Script ID збігається з production!');
          try {JSON.parse(credentials);}catch{throw Error('Некоректний формат захищеної авторизації clasp.');}
          if(!/^[a-zA-Z0-9_-]{20,}$/.test(staging)||!/^[a-zA-Z0-9_-]{20,}$/.test(production))throw Error('Некоректний Script ID.');
          fs.writeFileSync(path.join(os.homedir(),'.clasprc.json'),credentials,{mode:0o600});
          fs.writeFileSync('.clasp.json',JSON.stringify({scriptId:staging,rootDir:'dist/apps-script'}),{mode:0o600});
          process.stdout.write('Тестовий Script ID підтверджено як відмінний від production.\n');
          NODE
      - name: Завантажити код лише в тестовий Apps Script (без публікації)
        run: npm exec --yes --package=@google/clasp@3.4.1 -- clasp push --force
      - name: Видалити тимчасові облікові файли
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json" ".clasp.json"
